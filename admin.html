<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    h1 {
      text-align: center;
      color: #7b1e1e;
      font-size: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: #7b1e1e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #555;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a40000;
    }

    .event {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .event img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
    }

    #adminPanel {
      display: none;
    }

    #loginBox {
      max-width: 500px;
      margin: 60px auto;
    }

    .hint {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h1>आपुलकी सेवाभावी संस्था</h1>
    <h2>Admin Login</h2>

    <label for="loginEmail">Email</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <label for="loginPassword">Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="card">

      <h1>आपुलकी सेवाभावी संस्था</h1>
      <h2>Admin Panel</h2>

      <label for="title">कार्यक्रमाचे नाव</label>
      <input
        type="text"
        id="title"
        placeholder="उदा. मोफत आरोग्य तपासणी शिबिर"
      >

      <label for="date">कार्यक्रमाची तारीख</label>
      <input
        type="date"
        id="date"
      >

      <label for="description">कार्यक्रमाची माहिती</label>
      <textarea
        id="description"
        placeholder="कार्यक्रमाबद्दल सविस्तर माहिती येथे लिहा..."
      ></textarea>

      <label for="image">कार्यक्रमाचा फोटो</label>
      <input
        type="file"
        id="image"
        accept="image/*"
      >

      <div class="hint">
        फोटो निवडणे ऐच्छिक आहे.
      </div>

      <button onclick="saveEvent()">Save Event</button>

      <div id="saveMessage" class="message"></div>

      <button class="logout" onclick="logout()">Logout</button>

    </div>


    <!-- EVENTS LIST -->
    <div class="card">

      <h2>सेव केलेले कार्यक्रम</h2>

      <button onclick="loadEvents()">Refresh Events</button>

      <div id="eventsList">
        कार्यक्रम लोड होत आहेत...
      </div>

    </div>

  </div>

</div>


<script>

  /*
    =====================================================
    SUPABASE SETTINGS
    =====================================================
    खाली तुमचा सध्याचा Project URL आणि Publishable Key
    जसे आहेत तसेच ठेवा.
  */

  const SUPABASE_URL =
    "https://mwwhzjuxfhbrqzxhfglj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    
"sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // -----------------------------------------------------
  // MESSAGE
  // -----------------------------------------------------

  function showMessage(elementId, message, type) {

    const element = document.getElementById(elementId);

    element.textContent = message;

    element.className = "message " + type;
  }


  // -----------------------------------------------------
  // LOGIN
  // -----------------------------------------------------

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Email आणि Password भरा.",
        "error"
      );

      return;
    }


    showMessage(
      "loginMessage",
      "Login होत आहे...",
      "success"
    );


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message,
        "error"
      );

      return;
    }


    document.getElementById("loginBox").style.display = "none";

    document.getElementById("adminPanel").style.display = "block";

    await loadEvents();
  }


  // -----------------------------------------------------
  // CHECK LOGIN
  // -----------------------------------------------------

  async function checkLogin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("adminPanel").style.display = "block";

      await loadEvents();
    }
  }


  // -----------------------------------------------------
  // SAVE EVENT
  // -----------------------------------------------------

  async function saveEvent() {

    const title =
      document.getElementById("title").value.trim();

    const date =
      document.getElementById("date").value;

    const description =
      document.getElementById("description").value.trim();

    const imageInput =
      document.getElementById("image");

    const file =
      imageInput.files[0];


    // Required fields

    if (!title) {

      showMessage(
        "saveMessage",
        "कृपया कार्यक्रमाचे नाव भरा.",
        "error"
      );

      return;
    }


    if (!date) {

      showMessage(
        "saveMessage",
        "कृपया कार्यक्रमाची तारीख निवडा.",
        "error"
      );

      return;
    }


    if (!description) {

      showMessage(
        "saveMessage",
        "कृपया कार्यक्रमाची माहिती लिहा.",
        "error"
      );

      return;
    }


    showMessage(
      "saveMessage",
      "कार्यक्रम सेव होत आहे...",
      "success"
    );


    let imageUrl = null;


    // ---------------------------------------------------
    // IMAGE UPLOAD
    // ---------------------------------------------------

    if (file) {

      try {

        const safeName =
          file.name
            .replace(/[^a-zA-Z0-9._-]/g, "_");

        const filePath =
          Date.now() + "_" + safeName;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("uploads")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          showMessage(
            "saveMessage",
            "फोटो Upload झाला नाही: " +
            uploadError.message,
            "error"
          );

          return;
        }


        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("uploads")
            .getPublicUrl(filePath);


        imageUrl =
          publicUrlData.publicUrl;

      }

      catch (error) {

        showMessage(
          "saveMessage",
          "फोटो Upload करताना समस्या: " +
          error.message,
          "error"
        );

        return;
      }
    }


    // ---------------------------------------------------
    // INSERT EVENT
    // ---------------------------------------------------

    try {

      /*
        IMPORTANT:
        येथे फक्त events table मध्ये सध्या निश्चित असलेले
        columns वापरले आहेत:

        title
        date
        description
        image

        ID आणि Created at Supabase स्वतः भरेल.
      */

      const eventData = {

        title: title,

        date: date,

        description: description,

        image: imageUrl

      };


      const {
        error: insertError
      } =
        await supabaseClient
          .from("events")
          .insert([eventData]);


      if (insertError) {

        showMessage(
          "saveMessage",
          "कार्यक्रम सेव झाला नाही: " +
          insertError.message,
          "error"
        );

        return;
      }


      // SUCCESS

      showMessage(
        "saveMessage",
        "✅ कार्यक्रम यशस्वीपणे सेव झाला!",
        "success"
      );


      // Clear form

      document.getElementById("title").value = "";

      document.getElementById("date").value = "";

      document.getElementById("description").value = "";

      document.getElementById("image").value = "";


      await loadEvents();

    }

    catch (error) {

      showMessage(
        "saveMessage",
        "कार्यक्रम सेव झाला नाही: " +
        error.message,
        "error"
      );
    }
  }


  // -----------------------------------------------------
  // LOAD EVENTS
  // -----------------------------------------------------

  async function loadEvents() {

    const list =
      document.getElementById("eventsList");


    list.innerHTML =
      "कार्यक्रम लोड होत आहेत...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .select("*")
        .order(
          "date",
          { ascending: false }
        );


    if (error) {

      list.innerHTML =
        "<p>कार्यक्रम लोड झाले नाहीत: " +
        escapeHtml(error.message) +
        "</p>";

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>अजून कोणताही कार्यक्रम सेव केलेला नाही.</p>";

      return;
    }


    list.innerHTML = "";


    data.forEach(function(event) {

      const div =
        document.createElement("div");

      div.className = "event";


      let html = "";

      html +=
        "<h3>" +
        escapeHtml(event.title || "") +
        "</h3>";


      if (event.date) {

        html +=
          "<p><strong>तारीख:</strong> " +
          escapeHtml(event.date) +
          "</p>";
      }


      if (event.description) {

        html +=
          "<p>" +
          escapeHtml(event.description) +
          "</p>";
      }


      if (event.image) {

        html +=
          '<img src="' +
          escapeAttribute(event.image) +
          '" alt="कार्यक्रमाचा फोटो">';
      }


      div.innerHTML = html;

      list.appendChild(div);

    });
  }


  // -----------------------------------------------------
  // LOGOUT
  // -----------------------------------------------------

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel").style.display = "none";

    document.getElementById("loginBox").style.display = "block";

    document.getElementById("loginPassword").value = "";

    showMessage(
      "loginMessage",
      "Logout झाले.",
      "success"
    );
  }


  // -----------------------------------------------------
  // SECURITY HELPERS
  // -----------------------------------------------------

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  // -----------------------------------------------------
  // START
  // -----------------------------------------------------

  checkLogin();

</script>

</body>
</html>
