<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .event {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      background: #fff;
    }

    .event img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
    }

    .event-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .event-date,
    .event-location {
      color: #555;
      margin: 5px 0;
    }

    .event-description {
      margin-top: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .preview {
      max-width: 100%;
      max-height: 250px;
      margin-top: 12px;
      border-radius: 12px;
      display: none;
    }

    .small {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h1>आपुलकी सेवाभावी संस्था</h1>
    <h2>Admin Panel Login</h2>

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="username"
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="primary" id="loginBtn">
      Login
    </button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">

    <div class="card">
      <div class="topbar">
        <div>
          <h1>आपुलकी सेवाभावी संस्था</h1>
          <p class="small">कार्यक्रम / उपक्रम Admin Panel</p>
        </div>

        <button class="danger" id="logoutBtn">
          Logout
        </button>
      </div>
    </div>


    <!-- ADD EVENT -->
    <div class="card">

      <h2>नवीन कार्यक्रम / उपक्रम</h2>

      <label for="title">
        कार्यक्रमाचे नाव
      </label>

      <input
        type="text"
        id="title"
        placeholder="उदा. मोफत आरोग्य तपासणी शिबिर"
      >


      <label for="date">
        तारीख
      </label>

      <input
        type="date"
        id="date"
      >


      <label for="location">
        ठिकाण
      </label>

      <input
        type="text"
        id="location"
        placeholder="उदा. कागल"
      >


      <label for="description">
        कार्यक्रमाची माहिती
      </label>

      <textarea
        id="description"
        placeholder="कार्यक्रमाची सविस्तर माहिती येथे लिहा..."
      ></textarea>


      <label for="imageFile">
        कार्यक्रमाचा फोटो
      </label>

      <input
        type="file"
        id="imageFile"
        accept="image/*"
      >

      <img
        id="imagePreview"
        class="preview"
        alt="Photo preview"
      >


      <button class="primary" id="saveBtn">
        Save Event
      </button>

      <div id="saveMessage" class="message"></div>

    </div>


    <!-- SAVED EVENTS -->
    <div class="card">

      <div class="topbar">
        <h2>Saved Events</h2>

        <button
          class="secondary"
          id="refreshBtn"
        >
          Refresh
        </button>
      </div>

      <div id="eventsMessage" class="message"></div>

      <div id="eventsList">
        <p class="small">Events loading...</p>
      </div>

    </div>

  </div>

</div>


<script>

  /*
    ==========================================================
    SUPABASE SETTINGS
    ==========================================================

    फक्त खालील दोन values मध्ये तुमची माहिती टाका.

    1. SUPABASE_URL
       तुमचा Project URL

    2. SUPABASE_PUBLISHABLE_KEY
       तुमचा Publishable Key

    Secret Key येथे टाकू नका.
  */

  const SUPABASE_URL =
    "https://mwwhzjuxfhbrqzxhfglj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================
     ELEMENTS
     ========================= */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const saveBtn =
    document.getElementById("saveBtn");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const titleInput =
    document.getElementById("title");

  const dateInput =
    document.getElementById("date");

  const locationInput =
    document.getElementById("location");

  const descriptionInput =
    document.getElementById("description");

  const imageFileInput =
    document.getElementById("imageFile");

  const imagePreview =
    document.getElementById("imagePreview");

  const eventsList =
    document.getElementById("eventsList");


  /* =========================
     MESSAGE FUNCTION
     ========================= */

  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

  }


  function clearMessage(element) {

    element.textContent = "";

    element.className =
      "message";

  }


  /* =========================
     ESCAPE HTML
     ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     LOGIN
     ========================= */

  loginBtn.addEventListener("click", async function() {

    clearMessage(
      document.getElementById("loginMessage")
    );

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      showMessage(
        document.getElementById("loginMessage"),
        "Email आणि Password भरा.",
        "error"
      );

      return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";


    if (error) {

      showMessage(
        document.getElementById("loginMessage"),
        "Login failed: " + error.message,
        "error"
      );

      return;
    }


    if (data && data.user) {

      loginBox.classList.add("hidden");

      adminPanel.classList.remove("hidden");

      await loadEvents();

    }

  });


  /* =========================
     LOGOUT
     ========================= */

  logoutBtn.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    adminPanel.classList.add("hidden");

    loginBox.classList.remove("hidden");

    passwordInput.value = "";

  });


  /* =========================
     PHOTO PREVIEW
     ========================= */

  imageFileInput.addEventListener(
    "change",
    function() {

      const file =
        imageFileInput.files[0];

      if (!file) {

        imagePreview.style.display =
          "none";

        imagePreview.src = "";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          imagePreview.src =
            event.target.result;

          imagePreview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


  /* =========================
     UPLOAD IMAGE
     ========================= */

  async function uploadImage(file) {

    if (!file) {

      return null;

    }


    const extension =
      file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "jpg";


    const fileName =
      "event-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8) +
      "." +
      extension;


    const filePath =
      "events/" + fileName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("uploads")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      throw new Error(
        "Photo upload failed: " +
        uploadError.message
      );

    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from("uploads")
        .getPublicUrl(filePath);


    if (!data || !data.publicUrl) {

      throw new Error(
        "Photo URL मिळाली नाही."
      );

    }


    return data.publicUrl;

  }


  /* =========================
     SAVE EVENT
     ========================= */

  saveBtn.addEventListener(
    "click",
    async function() {

      clearMessage(
        document.getElementById("saveMessage")
      );


      const title =
        titleInput.value.trim();

      const date =
        dateInput.value;

      const location =
        locationInput.value.trim();

      const description =
        descriptionInput.value.trim();

      const imageFile =
        imageFileInput.files[0];


      if (!title) {

        showMessage(
          document.getElementById("saveMessage"),
          "कार्यक्रमाचे नाव भरा.",
          "error"
        );

        return;

      }


      if (!date) {

        showMessage(
          document.getElementById("saveMessage"),
          "तारीख निवडा.",
          "error"
        );

        return;

      }


      if (!description) {

        showMessage(
          document.getElementById("saveMessage"),
          "कार्यक्रमाची माहिती भरा.",
          "error"
        );

        return;

      }


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      try {

        let imageUrl = null;


        /*
          फोटो असल्यास आधी Storage मध्ये upload.
        */

        if (imageFile) {

          imageUrl =
            await uploadImage(imageFile);

        }


        /*
          येथे description field थेट
          public.events मध्ये save होते.
        */

        const {
          error
        } =
          await supabaseClient
            .from("events")
            .insert([
              {
                title: title,
                date: date,
                description: description,
                image: imageUrl,
                location: location || null
              }
            ]);


        if (error) {

          throw new Error(
            error.message
          );

        }


        showMessage(
          document.getElementById("saveMessage"),
          "Event successfully submitted.",
          "success"
        );


        /*
          Form clear
        */

        titleInput.value = "";

        dateInput.value = "";

        locationInput.value = "";

        descriptionInput.value = "";

        imageFileInput.value = "";

        imagePreview.src = "";

        imagePreview.style.display =
          "none";


        /*
          नवीन Event लगेच list मध्ये दाखवा.
        */

        await loadEvents();


      } catch (error) {

        showMessage(
          document.getElementById("saveMessage"),
          "Event save failed:\n" +
          error.message,
          "error"
        );

      }


      saveBtn.disabled = false;

      saveBtn.textContent =
        "Save Event";

    }
  );


  /* =========================
     LOAD EVENTS
     ========================= */

  async function loadEvents() {

    eventsList.innerHTML =
      "<p class='small'>Events loading...</p>";


    clearMessage(
      document.getElementById("eventsMessage")
    );


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .select(
            "id, created_at, title, date, description, image, location"
          )
          .order(
            "date",
            {
              ascending: false
            }
          );


      if (error) {

        throw new Error(
          error.message
        );

      }


      if (!data || data.length === 0) {

        eventsList.innerHTML =
          "<p class='small'>No Events उपलब्ध नाहीत.</p>";

        return;

      }


      eventsList.innerHTML =
        data
          .map(function(event) {

            const imageHtml =
              event.image
                ? `
                  <img
                    src="${escapeHtml(event.image)}"
                    alt="${escapeHtml(event.title)}"
                  >
                `
                : "";


            const dateHtml =
              event.date
                ? `
                  <div class="event-date">
                    📅 ${escapeHtml(event.date)}
                  </div>
                `
                : "";


            const locationHtml =
              event.location
                ? `
                  <div class="event-location">
                    📍 ${escapeHtml(event.location)}
                  </div>
                `
                : "";


            return `
              <div class="event">

                <div class="event-title">
                  ${escapeHtml(event.title)}
                </div>

                ${dateHtml}

                ${locationHtml}

                ${imageHtml}

                <div class="event-description">
                  ${escapeHtml(event.description)}
                </div>

              </div>
            `;

          })
          .join("");


    } catch (error) {

      eventsList.innerHTML =
        "";

      showMessage(
        document.getElementById("eventsMessage"),
        "Events load failed:\n" +
        error.message,
        "error"
      );

    }

  }


  /* =========================
     REFRESH
     ========================= */

  refreshBtn.addEventListener(
    "click",
    async function() {

      await loadEvents();

    }
  );


  /* =========================
     CHECK EXISTING SESSION
     ========================= */

  async function checkSession() {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      loginBox.classList.add("hidden");

      adminPanel.classList.remove("hidden");

      await loadEvents();

    }

  }


  checkSession();

</script>

</body>
</html>
