<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #7b1e1e;
      font-size: 25px;
      margin-top: 0;
    }

    h2 {
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #7b1e1e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      background: #555;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a40000;
    }

    .hint {
      margin-top: 5px;
      font-size: 14px;
      color: #666;
    }

    #adminPanel {
      display: none;
    }

    #loginBox {
      max-width: 500px;
      margin: 60px auto;
    }

    .event {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .event h3 {
      margin-top: 0;
      color: #7b1e1e;
    }

    .event img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ================= LOGIN ================= -->

  <div id="loginBox" class="card">

    <h1>आपुलकी सेवाभावी संस्था</h1>

    <h2>Admin Login</h2>

    <label for="loginEmail">Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <label for="loginPassword">Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ================= ADMIN PANEL ================= -->

  <div id="adminPanel">

    <div class="card">

      <h1>आपुलकी सेवाभावी संस्था</h1>

      <h2>कार्यक्रम / उपक्रम व्यवस्थापन</h2>


      <!-- TITLE -->

      <label for="title">
        कार्यक्रमाचे नाव
      </label>

      <input
        type="text"
        id="title"
        placeholder="उदा. मोफत आरोग्य तपासणी शिबिर"
      >


      <!-- DATE -->

      <label for="date">
        कार्यक्रमाची तारीख
      </label>

      <input
        type="date"
        id="date"
      >


      <!-- LOCATION -->

      <label for="location">
        ठिकाण
      </label>

      <input
        type="text"
        id="location"
        placeholder="उदा. कागल"
      >


      <!-- DESCRIPTION -->

      <label for="description">
        कार्यक्रमाची माहिती
      </label>

      <textarea
        id="description"
        placeholder="कार्यक्रमाबद्दल सविस्तर माहिती येथे लिहा..."
      ></textarea>


      <!-- IMAGE -->

      <label for="image">
        कार्यक्रमाचा फोटो
      </label>

      <input
        type="file"
        id="image"
        accept="image/*"
      >

      <div class="hint">
        फोटो निवडणे ऐच्छिक आहे. फोटो नसेल तरी कार्यक्रम सेव करता येईल.
      </div>


      <!-- SAVE -->

      <button
        id="saveButton"
        onclick="saveEvent()"
      >
        Save Event
      </button>

      <div id="saveMessage" class="message"></div>


      <!-- LOGOUT -->

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- ================= EVENTS ================= -->

    <div class="card">

      <h2>सेव केलेले कार्यक्रम</h2>

      <button onclick="loadEvents()">
        Refresh Events
      </button>

      <div id="eventsList">
        कार्यक्रम लोड होत आहेत...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
   =====================================================

   तुमचा सध्याचा Project URL आणि Publishable Key
   येथे जसे आहेत तसेच ठेवा.

   Secret Key येथे कधीही टाकू नका.
   ===================================================== */

const SUPABASE_URL =
  "https://mwwhzjuxfhbrqzxhfglj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   MESSAGE FUNCTION
   ===================================================== */

function showMessage(elementId, message, type) {

  const element =
    document.getElementById(elementId);

  element.textContent = message;

  element.className =
    "message " + type;
}


/* =====================================================
   LOGIN
   ===================================================== */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Email आणि Password भरा.",
      "error"
    );

    return;
  }


  const loginButton =
    document.getElementById("loginButton");

  loginButton.disabled = true;


  showMessage(
    "loginMessage",
    "Login होत आहे...",
    "success"
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message,
        "error"
      );

      loginButton.disabled = false;

      return;
    }


    if (!data.session) {

      showMessage(
        "loginMessage",
        "Login session मिळाली नाही.",
        "error"
      );

      loginButton.disabled = false;

      return;
    }


    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("adminPanel").style.display =
      "block";


    await loadEvents();

  }

  catch (error) {

    showMessage(
      "loginMessage",
      "Login error: " + error.message,
      "error"
    );

  }

  finally {

    loginButton.disabled = false;

  }
}


/* =====================================================
   CHECK EXISTING LOGIN
   ===================================================== */

async function checkLogin() {

  try {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (session) {

      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("adminPanel").style.display =
        "block";

      await loadEvents();
    }

  }

  catch (error) {

    console.error(
      "Session check error:",
      error
    );

  }
}


/* =====================================================
   SAVE EVENT
   ===================================================== */

async function saveEvent() {

  const title =
    document
      .getElementById("title")
      .value
      .trim();

  const date =
    document
      .getElementById("date")
      .value;

  const location =
    document
      .getElementById("location")
      .value
      .trim();

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const imageInput =
    document.getElementById("image");

  const file =
    imageInput.files[0];


  /* -----------------------------------------------
     VALIDATION
     ----------------------------------------------- */

  if (!title) {

    showMessage(
      "saveMessage",
      "कृपया कार्यक्रमाचे नाव भरा.",
      "error"
    );

    return;
  }


  if (!date) {

    showMessage(
      "saveMessage",
      "कृपया कार्यक्रमाची तारीख निवडा.",
      "error"
    );

    return;
  }


  if (!description) {

    showMessage(
      "saveMessage",
      "कृपया कार्यक्रमाची माहिती लिहा.",
      "error"
    );

    return;
  }


  const saveButton =
    document.getElementById("saveButton");

  saveButton.disabled = true;


  showMessage(
    "saveMessage",
    "कार्यक्रम सेव होत आहे...",
    "success"
  );


  let imageUrl = null;


  /* -----------------------------------------------
     PHOTO UPLOAD
     ----------------------------------------------- */

  if (file) {

    try {

      const safeFileName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const filePath =
        Date.now() +
        "_" +
        safeFileName;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("uploads")
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (uploadError) {

        showMessage(
          "saveMessage",
          "फोटो Upload झाला नाही: " +
          uploadError.message,
          "error"
        );

        saveButton.disabled = false;

        return;
      }


      const {
        data: publicUrlData
      } =
        supabaseClient
          .storage
          .from("uploads")
          .getPublicUrl(filePath);


      imageUrl =
        publicUrlData.publicUrl;

    }

    catch (error) {

      showMessage(
        "saveMessage",
        "फोटो Upload करताना समस्या: " +
        error.message,
        "error"
      );

      saveButton.disabled = false;

      return;
    }
  }


  /* -----------------------------------------------
     DATABASE SAVE

     आता थेट events.insert वापरण्याऐवजी
     आपण Supabase मध्ये तयार केलेल्या
     add_event() function चा वापर करत आहोत.
     ----------------------------------------------- */

  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "add_event",
        {
          p_title: title,
          p_date: date,
          p_description: description,
          p_image: imageUrl,
          p_location: location || null
        }
      );


    if (error) {

      showMessage(
        "saveMessage",
        "कार्यक्रम सेव झाला नाही: " +
        error.message,
        "error"
      );

      saveButton.disabled = false;

      return;
    }


    /* -----------------------------------------------
       SUCCESS
       ----------------------------------------------- */

    showMessage(
      "saveMessage",
      "✅ कार्यक्रम यशस्वीपणे सेव झाला!",
      "success"
    );


    /* CLEAR FORM */

    document.getElementById("title").value = "";

    document.getElementById("date").value = "";

    document.getElementById("location").value = "";

    document.getElementById("description").value = "";

    document.getElementById("image").value = "";


    /* REFRESH LIST */

    await loadEvents();


  }

  catch (error) {

    showMessage(
      "saveMessage",
      "कार्यक्रम सेव झाला नाही: " +
      error.message,
      "error"
    );

  }

  finally {

    saveButton.disabled = false;

  }
}


/* =====================================================
   LOAD EVENTS
   ===================================================== */

async function loadEvents() {

  const list =
    document.getElementById("eventsList");


  list.innerHTML =
    "<p>कार्यक्रम लोड होत आहेत...</p>";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .select(
          "id, created_at, title, date, image, location, description"
        )
        .order(
          "date",
          {
            ascending: false
          }
        );


    if (error) {

      list.innerHTML =
        "<p>कार्यक्रम लोड झाले नाहीत: " +
        escapeHtml(error.message) +
        "</p>";

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>अजून कोणताही कार्यक्रम सेव केलेला नाही.</p>";

      return;
    }


    list.innerHTML = "";


    data.forEach(function(event) {

      const div =
        document.createElement("div");

      div.className = "event";


      let html = "";


      if (event.title) {

        html +=
          "<h3>" +
          escapeHtml(event.title) +
          "</h3>";
      }


      if (event.date) {

        html +=
          "<p><strong>तारीख:</strong> " +
          escapeHtml(event.date) +
          "</p>";
      }


      if (event.location) {

        html +=
          "<p><strong>ठिकाण:</strong> " +
          escapeHtml(event.location) +
          "</p>";
      }


      if (event.description) {

        html +=
          "<p>" +
          escapeHtml(event.description) +
          "</p>";
      }


      if (event.image) {

        html +=
          '<img src="' +
          escapeAttribute(event.image) +
          '" alt="कार्यक्रमाचा फोटो">';
      }


      div.innerHTML = html;


      list.appendChild(div);

    });

  }

  catch (error) {

    list.innerHTML =
      "<p>कार्यक्रम लोड करताना समस्या: " +
      escapeHtml(error.message) +
      "</p>";
  }
}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout() {

  try {

    await supabaseClient.auth.signOut();

  }

  catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }


  document.getElementById("adminPanel").style.display =
    "none";

  document.getElementById("loginBox").style.display =
    "block";

  document.getElementById("loginPassword").value = "";


  showMessage(
    "loginMessage",
    "Logout झाले.",
    "success"
  );
}


/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


/* =====================================================
   START
   ===================================================== */

checkLogin();

</script>

</body>
</html>
