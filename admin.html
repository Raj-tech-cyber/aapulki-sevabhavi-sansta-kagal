
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    h1 {
      color: #166534;
      text-align: center;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #16a34a;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #16a34a;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #374151;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    #adminPanel {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .event {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      background: #fafafa;
    }

    .event img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .event h3 {
      margin: 5px 0 10px;
    }

    .event p {
      margin: 6px 0;
      line-height: 1.6;
    }

    .preview {
      margin-top: 12px;
      display: none;
    }

    .preview img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h1>आपुलकी सेवाभावी संस्था</h1>
    <h2>Admin Login</h2>

    <label for="loginEmail">Email</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <label for="loginPassword">Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="btn-primary" id="loginBtn">
      Login
    </button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="topbar">
      <h1>आपुलकी Admin Panel</h1>

      <button class="btn-secondary" id="logoutBtn">
        Logout
      </button>
    </div>


    <!-- ADD EVENT -->
    <div class="card">

      <h2>नवीन कार्यक्रम / उपक्रम</h2>

      <label for="title">
        कार्यक्रमाचे नाव
      </label>

      <input
        type="text"
        id="title"
        placeholder="कार्यक्रमाचे नाव लिहा"
      >


      <label for="date">
        तारीख
      </label>

      <input
        type="datetime-local"
        id="date"
      >


      <label for="location">
        ठिकाण
      </label>

      <input
        type="text"
        id="location"
        placeholder="उदा. कागल"
      >


      <label for="description">
        कार्यक्रमाची माहिती
      </label>

      <textarea
        id="description"
        placeholder="कार्यक्रमाची सविस्तर माहिती लिहा"
      ></textarea>


      <label for="image">
        कार्यक्रमाचा फोटो
      </label>

      <input
        type="file"
        id="image"
        accept="image/*"
      >

      <div class="small">
        फोटो निवडणे ऐच्छिक आहे.
      </div>

      <div id="imagePreview" class="preview">
        <img id="previewImg" src="" alt="फोटो पूर्वदृश्य">
      </div>


      <button class="btn-primary" id="saveBtn">
        कार्यक्रम जतन करा
      </button>

      <div id="saveMessage" class="message"></div>

    </div>


    <!-- EVENTS -->
    <div class="card">

      <h2>जतन केलेले कार्यक्रम</h2>

      <div id="eventsList">
        कार्यक्रमांची माहिती लोड होत आहे...
      </div>

    </div>

  </div>

</div>


<script>
  /*
    ==========================================================
    SUPABASE SETTINGS
    ==========================================================
  */

  const SUPABASE_URL = "https://mwwhzjuxfhbrqzxhfglj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = 
"sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";

  /*
    ==========================================================
    SUPABASE CLIENT
    ==========================================================
  */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /*
    ==========================================================
    ELEMENTS
    ==========================================================
  */

  const loginBox = document.getElementById("loginBox");
  const adminPanel = document.getElementById("adminPanel");

  const loginEmail = document.getElementById("loginEmail");
  const loginPassword = document.getElementById("loginPassword");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const loginMessage = document.getElementById("loginMessage");
  const saveMessage = document.getElementById("saveMessage");

  const titleInput = document.getElementById("title");
  const dateInput = document.getElementById("date");
  const locationInput = document.getElementById("location");
  const descriptionInput = document.getElementById("description");
  const imageInput = document.getElementById("image");

  const imagePreview = document.getElementById("imagePreview");
  const previewImg = document.getElementById("previewImg");

  const saveBtn = document.getElementById("saveBtn");
  const eventsList = document.getElementById("eventsList");


  /*
    ==========================================================
    MESSAGE FUNCTION
    ==========================================================
  */

  function showMessage(element, message, type) {

    element.textContent = message;

    element.className = "message " + type;

  }


  /*
    ==========================================================
    LOGIN
    ==========================================================
  */

  loginBtn.addEventListener("click", async function () {

    const email = loginEmail.value.trim();
    const password = loginPassword.value;

    if (!email || !password) {

      showMessage(
        loginMessage,
        "कृपया Email आणि Password भरा.",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Login होत आहे...";

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {

      showMessage(
        loginMessage,
        "Login failed: " + error.message,
        "error"
      );

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

      return;
    }

    loginBox.style.display = "none";
    adminPanel.style.display = "block";

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

    loadEvents();

  });


  /*
    ==========================================================
    CHECK CURRENT USER
    ==========================================================
  */

  async function checkUser() {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();

    if (session) {

      loginBox.style.display = "none";
      adminPanel.style.display = "block";

      loadEvents();

    } else {

      loginBox.style.display = "block";
      adminPanel.style.display = "none";

    }

  }


  /*
    ==========================================================
    IMAGE PREVIEW
    ==========================================================
  */

  imageInput.addEventListener("change", function () {

    const file = imageInput.files[0];

    if (!file) {

      imagePreview.style.display = "none";
      previewImg.src = "";

      return;
    }

    const reader = new FileReader();

    reader.onload = function (event) {

      previewImg.src = event.target.result;

      imagePreview.style.display = "block";

    };

    reader.readAsDataURL(file);

  });


  /*
    ==========================================================
    SAVE EVENT
    ==========================================================
  */

  saveBtn.addEventListener("click", async function () {

    const title = titleInput.value.trim();
    const date = dateInput.value;
    const location = locationInput.value.trim();
    const description = descriptionInput.value.trim();

    const file = imageInput.files[0];


    /*
      Basic validation
    */

    if (!title) {

      showMessage(
        saveMessage,
        "कृपया कार्यक्रमाचे नाव लिहा.",
        "error"
      );

      return;
    }

    if (!description) {

      showMessage(
        saveMessage,
        "कृपया कार्यक्रमाची माहिती लिहा.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "जतन होत आहे...";


    try {

      let imageUrl = null;


      /*
        ======================================================
        IMAGE UPLOAD
        ======================================================
      */

      if (file) {

        const extension =
          file.name.split(".").pop().toLowerCase();

        const safeExtension =
          extension.replace(/[^a-z0-9]/g, "");

        const fileName =
          Date.now() +
          "-" +
          Math.random().toString(36).substring(2, 10) +
          "." +
          safeExtension;


        const filePath =
          "events/" + fileName;


        const {
          error: uploadError
        } = await supabaseClient
          .storage
          .from("uploads")
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


        if (uploadError) {

          throw new Error(
            "फोटो upload झाला नाही: " +
            uploadError.message
          );

        }


        const {
          data: publicData
        } = supabaseClient
          .storage
          .from("uploads")
          .getPublicUrl(filePath);


        imageUrl =
          publicData.publicUrl;

      }


      /*
        ======================================================
        INSERT EVENT
        ======================================================
      */

      const eventData = {
        title: title,
        date: date ? new Date(date).toISOString() : null,
        location: location || null,
        description: description,
        image: imageUrl
      };


      const {
        data: insertedEvent,
        error: insertError
      } = await supabaseClient
        .from("events")
        .insert([eventData])
        .select()
        .single();


      if (insertError) {

        throw new Error(
          "कार्यक्रम सेव झाला नाही: " +
          insertError.message
        );

      }


      /*
        ======================================================
        SUCCESS
        ======================================================
      */

      showMessage(
        saveMessage,
        "कार्यक्रम यशस्वीरित्या जतन झाला! ✅",
        "success"
      );


      /*
        Clear form
      */

      titleInput.value = "";
      dateInput.value = "";
      locationInput.value = "";
      descriptionInput.value = "";
      imageInput.value = "";

      imagePreview.style.display = "none";
      previewImg.src = "";


      /*
        Reload events
      */

      await loadEvents();


    } catch (error) {

      console.error(error);

      showMessage(
        saveMessage,
        error.message ||
        "कार्यक्रम सेव झाला नाही.",
        "error"
      );

    } finally {

      saveBtn.disabled = false;
      saveBtn.textContent = "कार्यक्रम जतन करा";

    }

  });


  /*
    ==========================================================
    LOAD EVENTS
    ==========================================================
  */

  async function loadEvents() {

    eventsList.innerHTML =
      "कार्यक्रमांची माहिती लोड होत आहे...";


    const {
      data,
      error
    } = await supabaseClient
      .from("events")
      .select("*")
      .order(
        "date",
        {
          ascending: false
        }
      );


    if (error) {

      eventsList.innerHTML =
        "<div class='message error' style='display:block'>" +
        "कार्यक्रम लोड झाले नाहीत: " +
        escapeHtml(error.message) +
        "</div>";

      return;
    }


    if (!data || data.length === 0) {

      eventsList.innerHTML =
        "<p>अजून कोणताही कार्यक्रम जतन केलेला नाही.</p>";

      return;
    }


    eventsList.innerHTML =
      data.map(function (event) {

        const title =
          escapeHtml(event.title || "कार्यक्रम");

        const description =
          escapeHtml(event.description || "");

        const location =
          escapeHtml(event.location || "");

        let dateText = "";

        if (event.date) {

          try {

            dateText =
              new Date(event.date)
                .toLocaleDateString(
                  "mr-IN",
                  {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                  }
                );

          } catch (e) {

            dateText = "";

          }

        }


        const imageHtml =
          event.image
            ? "<img src='" +
              escapeAttribute(event.image) +
              "' alt='" +
              escapeAttribute(event.title || "कार्यक्रम") +
              "'>"
            : "";


        return `
          <div class="event">

            ${imageHtml}

            <h3>${title}</h3>

            ${
              dateText
                ? `<p><strong>📅 तारीख:</strong> ${dateText}</p>`
                : ""
            }

            ${
              location
                ? `<p><strong>📍 ठिकाण:</strong> ${location}</p>`
                : ""
            }

            <p>
              <strong>माहिती:</strong><br>
              ${description.replace(/\n/g, "<br>")}
            </p>

          </div>
        `;

      }).join("");

  }


  /*
    ==========================================================
    LOGOUT
    ==========================================================
  */

  logoutBtn.addEventListener("click", async function () {

    await supabaseClient.auth.signOut();

    adminPanel.style.display = "none";
    loginBox.style.display = "block";

    loginPassword.value = "";

    showMessage(
      loginMessage,
      "Logout झाले.",
      "success"
    );

  });


  /*
    ==========================================================
    SECURITY / HTML ESCAPE
    ==========================================================
  */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

  }


  /*
    ==========================================================
    START
    ==========================================================
  */

  checkUser();

</script>

</body>
</html>
