<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #1769aa;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 20px;
      margin-top: 15px;
      margin-right: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1769aa;
      color: #ffffff;
    }

    .success {
      background: #198754;
      color: #ffffff;
    }

    .danger {
      background: #c62828;
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      background: #eef4ff;
      margin: 12px 0;
      line-height: 1.5;
    }

    .event {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
    }

    .event-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #1769aa;
    }

    .event-meta {
      color: #555;
      margin: 6px 0;
    }

    .event-description {
      margin-top: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .event img {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 14px;
    }

    #preview {
      display: none;
      width: 220px;
      max-height: 170px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 12px;
    }

    .top-info {
      color: #555;
      margin-top: -5px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ==================================================
       LOGIN
       ================================================== -->

  <div id="loginSection" class="card">

    <h1>आपुलकी सेवाभावी संस्था</h1>

    <h2>Admin Login</h2>

    <div id="loginMessage" class="message"></div>

    <label for="loginEmail">Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <label for="loginPassword">Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      class="primary"
      onclick="login()"
    >
      Login
    </button>

  </div>


  <!-- ==================================================
       ADMIN PANEL
       ================================================== -->

  <div id="adminSection" class="hidden">

    <!-- HEADER -->

    <div class="card">

      <h1>आपुलकी सेवाभावी संस्था</h1>

      <p class="top-info">
        कार्यक्रम व उपक्रम व्यवस्थापन
      </p>

      <button
        type="button"
        class="danger"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- ==================================================
         ADD EVENT
         ================================================== -->

    <div class="card">

      <h2>नवीन कार्यक्रम / उपक्रम</h2>

      <div id="eventMessage" class="message"></div>

      <label for="eventTitle">
        कार्यक्रमाचे नाव
      </label>

      <input
        type="text"
        id="eventTitle"
        placeholder="कार्यक्रमाचे नाव"
      >


      <label for="eventDate">
        तारीख
      </label>

      <input
        type="date"
        id="eventDate"
      >


      <label for="eventLocation">
        ठिकाण
      </label>

      <input
        type="text"
        id="eventLocation"
        placeholder="कार्यक्रमाचे ठिकाण"
      >


      <label for="eventDescription">
        कार्यक्रमाची माहिती
      </label>

      <textarea
        id="eventDescription"
        placeholder="कार्यक्रमाची माहिती येथे लिहा..."
      ></textarea>


      <label for="eventImage">
        कार्यक्रमाचा फोटो
      </label>

      <input
        type="file"
        id="eventImage"
        accept="image/*"
        onchange="previewImage()"
      >

      <img
        id="preview"
        alt="फोटो Preview"
      >

      <br>

      <button
        type="button"
        class="success"
        id="saveEventButton"
        onclick="saveEvent()"
      >
        कार्यक्रम सेव्ह करा
      </button>

    </div>


    <!-- ==================================================
         SAVED EVENTS
         ================================================== -->

    <div class="card">

      <h2>Saved Events</h2>

      <div
        id="eventsStatus"
        class="status"
      >
        कार्यक्रमांची माहिती लोड होत आहे...
      </div>

      <button
        type="button"
        class="primary"
        onclick="loadEvents()"
      >
        Refresh
      </button>

      <div id="eventsList"></div>

    </div>

  </div>

</div>


<script>

/* ======================================================
   SUPABASE SETTINGS

   फक्त खालील दोन ठिकाणी तुमची माहिती टाका.
   ====================================================== */

const SUPABASE_URL =
  "https://mwwhzjuxfhbrqzxhfglj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";


/* ======================================================
   SUPABASE CLIENT
   ====================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ======================================================
   MESSAGE FUNCTION
   ====================================================== */

function showMessage(
  elementId,
  message,
  success
) {

  const element =
    document.getElementById(elementId);

  element.style.display = "block";

  element.innerText = message;

  if (success) {

    element.style.background = "#e8f5e9";
    element.style.color = "#1b5e20";

  } else {

    element.style.background = "#ffebee";
    element.style.color = "#b71c1c";

  }
}


/* ======================================================
   LOGIN
   ====================================================== */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Email आणि Password भरा.",
      false
    );

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email: email,
        password: password
      });


  if (error) {

    showMessage(
      "loginMessage",
      "Login failed: " + error.message,
      false
    );

    return;
  }


  if (
    data &&
    data.session
  ) {

    document
      .getElementById("loginSection")
      .classList
      .add("hidden");

    document
      .getElementById("adminSection")
      .classList
      .remove("hidden");


    await loadEvents();
  }
}


/* ======================================================
   LOGOUT
   ====================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("adminSection")
    .classList
    .add("hidden");

  document
    .getElementById("loginSection")
    .classList
    .remove("hidden");
}


/* ======================================================
   PHOTO PREVIEW
   ====================================================== */

function previewImage() {

  const file =
    document
      .getElementById("eventImage")
      .files[0];

  const preview =
    document.getElementById("preview");


  if (!file) {

    preview.style.display = "none";

    return;
  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";
}


/* ======================================================
   SAVE EVENT
   ====================================================== */

async function saveEvent() {

  const title =
    document
      .getElementById("eventTitle")
      .value
      .trim();

  const date =
    document
      .getElementById("eventDate")
      .value;

  const location =
    document
      .getElementById("eventLocation")
      .value
      .trim();

  const description =
    document
      .getElementById("eventDescription")
      .value
      .trim();

  const file =
    document
      .getElementById("eventImage")
      .files[0];

  const saveButton =
    document.getElementById(
      "saveEventButton"
    );


  if (!title) {

    showMessage(
      "eventMessage",
      "कार्यक्रमाचे नाव भरा.",
      false
    );

    return;
  }


  if (!date) {

    showMessage(
      "eventMessage",
      "तारीख निवडा.",
      false
    );

    return;
  }


  saveButton.disabled = true;
  saveButton.innerText = "सेव्ह होत आहे...";


  try {

    let imageUrl = null;


    /* ----------------------------------------------
       PHOTO UPLOAD
       ---------------------------------------------- */

    if (file) {

      const safeFileName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
          );

      const filePath =
        "events/" +
        Date.now() +
        "-" +
        safeFileName;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from("uploads")
          .upload(
            filePath,
            file,
            {
              upsert: false
            }
          );


      if (uploadError) {

        showMessage(
          "eventMessage",
          "फोटो Upload झाला नाही: " +
          uploadError.message,
          false
        );

        return;
      }


      const {
        data: publicData
      } =
        supabaseClient.storage
          .from("uploads")
          .getPublicUrl(
            filePath
          );


      imageUrl =
        publicData.publicUrl;
    }


    /* ----------------------------------------------
       SAVE EVENT
       ---------------------------------------------- */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("events")
        .insert({
          title: title,
          date: date,
          description: description,
          location: location || null,
          image: imageUrl
        });


    if (insertError) {

      showMessage(
        "eventMessage",
        "कार्यक्रम सेव्ह झाला नाही: " +
        insertError.message,
        false
      );

      return;
    }


    showMessage(
      "eventMessage",
      "कार्यक्रम यशस्वीपणे सेव्ह झाला.",
      true
    );


    /* ----------------------------------------------
       CLEAR FORM
       ---------------------------------------------- */

    document
      .getElementById("eventTitle")
      .value = "";

    document
      .getElementById("eventDate")
      .value = "";

    document
      .getElementById("eventLocation")
      .value = "";

    document
      .getElementById("eventDescription")
      .value = "";

    document
      .getElementById("eventImage")
      .value = "";

    document
      .getElementById("preview")
      .style
      .display = "none";


    /* ----------------------------------------------
       LOAD SAVED EVENTS
       ---------------------------------------------- */

    await loadEvents();

  } catch (error) {

    showMessage(
      "eventMessage",
      "Error: " + error.message,
      false
    );

  } finally {

    saveButton.disabled = false;
    saveButton.innerText =
      "कार्यक्रम सेव्ह करा";
  }
}


/* ======================================================
   LOAD SAVED EVENTS

   येथे direct SELECT न वापरता
   get_admin_events() RPC वापरले आहे.
   ====================================================== */

async function loadEvents() {

  const status =
    document.getElementById(
      "eventsStatus"
    );

  const list =
    document.getElementById(
      "eventsList"
    );


  status.innerText =
    "कार्यक्रमांची माहिती लोड होत आहे...";

  list.innerHTML = "";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "get_admin_events"
        );


    console.log(
      "get_admin_events data:",
      data
    );

    console.log(
      "get_admin_events error:",
      error
    );


    /* ----------------------------------------------
       ERROR
       ---------------------------------------------- */

    if (error) {

      status.innerText =
        "कार्यक्रम लोड करताना Error: " +
        error.message;

      return;
    }


    /* ----------------------------------------------
       NO DATA
       ---------------------------------------------- */

    if (
      !data ||
      data.length === 0
    ) {

      status.innerText =
        "सध्या कोणताही कार्यक्रम सेव्ह केलेला नाही.";

      return;
    }


    /* ----------------------------------------------
       DATA FOUND
       ---------------------------------------------- */

    status.innerText =
      data.length +
      " कार्यक्रम सापडले.";


    data.forEach(
      function(event) {

        const eventBox =
          document.createElement(
            "div"
          );

        eventBox.className =
          "event";


        let html = "";


        /* TITLE */

        html +=
          '<div class="event-title">' +
          escapeHtml(
            event.title || ""
          ) +
          "</div>";


        /* DATE */

        if (event.date) {

          html +=
            '<div class="event-meta">' +
            "📅 " +
            escapeHtml(
              formatDate(event.date)
            ) +
            "</div>";
        }


        /* LOCATION */

        if (event.location) {

          html +=
            '<div class="event-meta">' +
            "📍 " +
            escapeHtml(
              event.location
            ) +
            "</div>";
        }


        /* DESCRIPTION */

        if (event.description) {

          html +=
            '<div class="event-description">' +
            escapeHtml(
              event.description
            ) +
            "</div>";
        }


        /* IMAGE */

        if (event.image) {

          html +=
            '<img src="' +
            escapeAttribute(
              event.image
            ) +
            '" alt="कार्यक्रमाचा फोटो">';
        }


        eventBox.innerHTML =
          html;


        list.appendChild(
          eventBox
        );

      }
    );


  } catch (error) {

    console.error(
      "loadEvents error:",
      error
    );

    status.innerText =
      "कार्यक्रम लोड करताना Error: " +
      error.message;
  }
}


/* ======================================================
   DATE FORMAT
   ====================================================== */

function formatDate(dateValue) {

  if (!dateValue) {
    return "";
  }


  const parts =
    String(dateValue)
      .split("-");


  if (parts.length === 3) {

    return (
      parts[2] +
      "-" +
      parts[1] +
      "-" +
      parts[0]
    );
  }


  return String(dateValue);
}


/* ======================================================
   HTML SECURITY
   ====================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeAttribute(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );
}


/* ======================================================
   CHECK EXISTING LOGIN SESSION
   ====================================================== */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (
    data &&
    data.session
  ) {

    document
      .getElementById("loginSection")
      .classList
      .add("hidden");

    document
      .getElementById("adminSection")
      .classList
      .remove("hidden");


    await loadEvents();
  }
}


/* ======================================================
   START
   ====================================================== */

checkSession();

</script>

</body>
</html>
