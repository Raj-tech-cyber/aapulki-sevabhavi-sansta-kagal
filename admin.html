<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 20px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1769aa;
      color: white;
    }

    .success {
      background: #198754;
      color: white;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    .secondary {
      background: #555;
      color: white;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 9px;
      margin: 12px 0;
      display: none;
    }

    .event {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      background: #fafafa;
    }

    .event-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .event-meta {
      color: #555;
      margin: 5px 0;
    }

    .event-description {
      line-height: 1.6;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .event img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 12px;
    }

    #preview {
      max-width: 220px;
      max-height: 160px;
      margin-top: 10px;
      border-radius: 10px;
      display: none;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      background: #eef4ff;
      margin: 12px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="card">

    <h1>आपुलकी सेवाभावी संस्था</h1>
    <h2>Admin Login</h2>

    <div id="loginMessage" class="message"></div>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Login
    </button>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" class="hidden">

    <div class="card">

      <h1>आपुलकी सेवाभावी संस्था</h1>

      <p>Admin Panel</p>

      <button
        class="danger"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- ADD EVENT -->

    <div class="card">

      <h2>नवीन कार्यक्रम / उपक्रम</h2>

      <div
        id="saveMessage"
        class="message"
      ></div>


      <label>कार्यक्रमाचे नाव</label>

      <input
        type="text"
        id="title"
        placeholder="कार्यक्रमाचे नाव"
      >


      <label>तारीख</label>

      <input
        type="date"
        id="date"
      >


      <label>ठिकाण</label>

      <input
        type="text"
        id="location"
        placeholder="कार्यक्रमाचे ठिकाण"
      >


      <label>कार्यक्रमाची माहिती</label>

      <textarea
        id="description"
        placeholder="कार्यक्रमाची माहिती लिहा..."
      ></textarea>


      <label>कार्यक्रमाचा फोटो</label>

      <input
        type="file"
        id="image"
        accept="image/*"
        onchange="previewPhoto()"
      >

      <img
        id="preview"
        alt="Photo Preview"
      >


      <br>

      <button
        class="success"
        id="saveButton"
        onclick="saveEvent()"
      >
        कार्यक्रम सेव्ह करा
      </button>

    </div>


    <!-- SAVED EVENTS -->

    <div class="card">

      <h2>Saved Events</h2>

      <div
        id="eventsStatus"
        class="status"
      >
        कार्यक्रमांची माहिती लोड होत आहे...
      </div>

      <button
        class="primary"
        onclick="loadEvents()"
      >
        Refresh
      </button>

      <div id="eventsList"></div>

    </div>

  </div>

</div>


<script>

  /* =====================================================
     SUPABASE SETTINGS
     ===================================================== */

  const SUPABASE_URL =
    "https://mwwhzjuxfhbrqzxhfglj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     MESSAGE
     ===================================================== */

  function showMessage(
    id,
    text,
    success
  ) {

    const box =
      document.getElementById(id);

    box.style.display = "block";

    box.innerText = text;

    box.style.background =
      success
        ? "#e8f5e9"
        : "#ffebee";

    box.style.color =
      success
        ? "#1b5e20"
        : "#b71c1c";
  }


  /* =====================================================
     LOGIN
     ===================================================== */

  async function login() {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Email आणि Password भरा.",
        false
      );

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email: email,
          password: password
        });


    if (error) {

      showMessage(
        "loginMessage",
        "Login failed: " +
        error.message,
        false
      );

      return;
    }


    if (data && data.session) {

      document
        .getElementById("loginBox")
        .classList
        .add("hidden");

      document
        .getElementById("adminPanel")
        .classList
        .remove("hidden");

      loadEvents();
    }
  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminPanel")
      .classList
      .add("hidden");

    document
      .getElementById("loginBox")
      .classList
      .remove("hidden");
  }


  /* =====================================================
     PHOTO PREVIEW
     ===================================================== */

  function previewPhoto() {

    const file =
      document
        .getElementById("image")
        .files[0];

    const preview =
      document.getElementById("preview");


    if (!file) {

      preview.style.display = "none";

      return;
    }


    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";
  }


  /* =====================================================
     SAVE EVENT
     ===================================================== */

  async function saveEvent() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const date =
      document
        .getElementById("date")
        .value;

    const location =
      document
        .getElementById("location")
        .value
        .trim();

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const file =
      document
        .getElementById("image")
        .files[0];


    if (!title) {

      showMessage(
        "saveMessage",
        "कार्यक्रमाचे नाव भरा.",
        false
      );

      return;
    }


    if (!date) {

      showMessage(
        "saveMessage",
        "तारीख निवडा.",
        false
      );

      return;
    }


    let imageUrl = null;


    /* PHOTO */

    if (file) {

      const fileName =
        Date.now() +
        "-" +
        file.name.replace(
          /\s+/g,
          "-"
        );

      const filePath =
        "events/" + fileName;


      const {
        error
      } =
        await supabaseClient.storage
          .from("uploads")
          .upload(
            filePath,
            file,
            {
              upsert: false
            }
          );


      if (error) {

        showMessage(
          "saveMessage",
          "फोटो Upload झाला नाही: " +
          error.message,
          false
        );

        return;
      }


      const {
        data
      } =
        supabaseClient.storage
          .from("uploads")
          .getPublicUrl(
            filePath
          );


      imageUrl =
        data.publicUrl;
    }


    /* DATABASE */

    const {
      error
    } =
      await supabaseClient
        .from("events")
        .insert({
          title: title,
          date: date,
          description: description,
          location:
            location || null,
          image: imageUrl
        });


    if (error) {

      showMessage(
        "saveMessage",
        "कार्यक्रम सेव्ह झाला नाही: " +
        error.message,
        false
      );

      return;
    }


    showMessage(
      "saveMessage",
      "कार्यक्रम यशस्वीपणे सेव्ह झाला.",
      true
    );


    /* CLEAR FORM */

    document
      .getElementById("title")
      .value = "";

    document
      .getElementById("date")
      .value = "";

    document
      .getElementById("location")
      .value = "";

    document
      .getElementById("description")
      .value = "";

    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("preview")
      .style
      .display = "none";


    /* LOAD AGAIN */

    await loadEvents();
  }


  /* =====================================================
     FINAL EVENT LOADER
     ===================================================== */

  async function loadEvents() {

    const status =
      document
        .getElementById("eventsStatus");

    const list =
      document
        .getElementById("eventsList");


    status.innerText =
      "कार्यक्रमांची माहिती लोड होत आहे...";

    list.innerHTML = "";


    /*
      महत्त्वाचे:
      आता direct SELECT नाही.
      Supabase RPC function वापरतो.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "get_admin_events"
        );


    if (error) {

      status.innerText =
        "कार्यक्रम लोड करताना Error: " +
        error.message;

      return;
    }


    if (!data || data.length === 0) {

      status.innerText =
        "सध्या कोणताही कार्यक्रम सेव्ह केलेला नाही.";

      return;
    }


    status.innerText =
      data.length +
      " कार्यक्रम सापडले.";


    data.forEach(
      function(event) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "event";


        let html = "";


        html +=
          '<div class="event-title">' +
          escapeHtml(
            event.title || ""
          ) +
          '</div>';


        if (event.date) {

          html +=
            '<div class="event-meta">📅 ' +
            escapeHtml(
              event.date
            ) +
            '</div>';
        }


        if (event.location) {

          html +=
            '<div class="event-meta">📍 ' +
            escapeHtml(
              event.location
            ) +
            '</div>';
        }


        if (event.description) {

          html +=
            '<div class="event-description">' +
            escapeHtml(
              event.description
            ) +
            '</div>';
        }


        if (event.image) {

          html +=
            '<img src="' +
            escapeAttribute(
              event.image
            ) +
            '" alt="कार्यक्रमाचा फोटो">';
        }


        div.innerHTML =
          html;


        list.appendChild(
          div
        );

      }
    );
  }


  /* =====================================================
     SECURITY
     ===================================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function escapeAttribute(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      );
  }


  /* =====================================================
     EXISTING SESSION
     ===================================================== */

  async function checkSession() {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (
      data &&
      data.session
    ) {

      document
        .getElementById("loginBox")
        .classList
        .add("hidden");

      document
        .getElementById("adminPanel")
        .classList
        .remove("hidden");

      loadEvents();
    }
  }


  checkSession();

</script>

</body>
</html>
