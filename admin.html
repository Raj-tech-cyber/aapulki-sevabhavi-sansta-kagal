<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आपुलकी सेवाभावी संस्था - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .primary {
      background: #1769aa;
      color: white;
    }

    .success {
      background: #16823b;
      color: white;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    .secondary {
      background: #666;
      color: white;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .event {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .event img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .event-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .small {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #preview {
      max-width: 200px;
      max-height: 150px;
      margin-top: 10px;
      border-radius: 8px;
      display: none;
    }

    .status {
      padding: 10px;
      background: #eef4ff;
      border-radius: 8px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">
    <h1>आपुलकी सेवाभावी संस्था</h1>
    <h2>Admin Login</h2>

    <div id="loginMessage" class="message"></div>

    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Admin Email">

    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password">

    <button class="primary" onclick="login()">Login</button>
  </div>


  <!-- ADMIN -->
  <div id="adminSection" class="hidden">

    <div class="card">
      <h1>आपुलकी सेवाभावी संस्था</h1>
      <p>Admin Panel</p>

      <button class="danger" onclick="logout()">Logout</button>
    </div>


    <!-- ADD EVENT -->
    <div class="card">

      <h2>नवीन कार्यक्रम / उपक्रम</h2>

      <div id="eventMessage" class="message"></div>

      <label>कार्यक्रमाचे नाव</label>
      <input
        type="text"
        id="eventTitle"
        placeholder="कार्यक्रमाचे नाव"
      >

      <label>तारीख</label>
      <input
        type="date"
        id="eventDate"
      >

      <label>ठिकाण</label>
      <input
        type="text"
        id="eventLocation"
        placeholder="कार्यक्रमाचे ठिकाण"
      >

      <label>कार्यक्रमाची माहिती</label>
      <textarea
        id="eventDescription"
        placeholder="कार्यक्रमाची माहिती येथे लिहा..."
      ></textarea>

      <label>कार्यक्रमाचा फोटो</label>
      <input
        type="file"
        id="eventImage"
        accept="image/*"
        onchange="previewImage()"
      >

      <img id="preview">

      <br><br>

      <button class="success" onclick="saveEvent()">
        कार्यक्रम सेव्ह करा
      </button>

    </div>


    <!-- SAVED EVENTS -->
    <div class="card">

      <h2>Saved Events</h2>

      <div class="status" id="eventsStatus">
        कार्यक्रमांची माहिती लोड होत आहे...
      </div>

      <button class="primary" onclick="loadEvents()">
        Refresh
      </button>

      <div id="eventsList"></div>

    </div>

  </div>

</div>


<script>

  // =====================================================
  // तुमचे Supabase Details
  // =====================================================

  const SUPABASE_URL = "https://mwwhzjuxfhbrqzxhfglj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = 
    "sb_publishable_Cyo3uCseac7_E1FoYXc4OA_4KVjDaMP";


  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // =====================================================
  // Message
  // =====================================================

  function showMessage(id, message, success = true) {

    const box = document.getElementById(id);

    box.style.display = "block";
    box.innerText = message;

    box.style.background = success ? "#e8f5e9" : "#ffebee";
    box.style.color = success ? "#1b5e20" : "#b71c1c";
  }


  // =====================================================
  // LOGIN
  // =====================================================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Email आणि Password भरा.",
        false
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message,
        false
      );

      return;
    }

    document.getElementById("loginSection")
      .classList.add("hidden");

    document.getElementById("adminSection")
      .classList.remove("hidden");

    loadEvents();
  }


  // =====================================================
  // LOGOUT
  // =====================================================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminSection")
      .classList.add("hidden");

    document.getElementById("loginSection")
      .classList.remove("hidden");
  }


  // =====================================================
  // IMAGE PREVIEW
  // =====================================================

  function previewImage() {

    const file =
      document.getElementById("eventImage").files[0];

    const preview =
      document.getElementById("preview");

    if (!file) {

      preview.style.display = "none";
      return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }


  // =====================================================
  // SAVE EVENT
  // =====================================================

  async function saveEvent() {

    const title =
      document.getElementById("eventTitle").value.trim();

    const date =
      document.getElementById("eventDate").value;

    const location =
      document.getElementById("eventLocation").value.trim();

    const description =
      document.getElementById("eventDescription")
        .value.trim();

    const file =
      document.getElementById("eventImage").files[0];


    if (!title) {

      showMessage(
        "eventMessage",
        "कार्यक्रमाचे नाव भरा.",
        false
      );

      return;
    }


    if (!date) {

      showMessage(
        "eventMessage",
        "तारीख निवडा.",
        false
      );

      return;
    }


    let imageUrl = null;


    // =================================================
    // IMAGE UPLOAD
    // =================================================

    if (file) {

      const fileName =
        Date.now() + "-" +
        file.name.replace(/\s+/g, "-");

      const filePath =
        "events/" + fileName;


      const { error: uploadError } =
        await supabaseClient.storage
          .from("uploads")
          .upload(filePath, file, {
            upsert: false
          });


      if (uploadError) {

        showMessage(
          "eventMessage",
          "फोटो Upload झाला नाही: " +
          uploadError.message,
          false
        );

        return;
      }


      const { data: publicData } =
        supabaseClient.storage
          .from("uploads")
          .getPublicUrl(filePath);


      imageUrl = publicData.publicUrl;
    }


    // =================================================
    // DATABASE INSERT
    // =================================================

    const { data, error } =
      await supabaseClient
        .from("events")
        .insert({
          title: title,
          date: date,
          description: description,
          location: location || null,
          image: imageUrl
        })
        .select();


    if (error) {

      showMessage(
        "eventMessage",
        "कार्यक्रम सेव्ह झाला नाही: " +
        error.message,
        false
      );

      return;
    }


    showMessage(
      "eventMessage",
      "कार्यक्रम यशस्वीपणे सेव्ह झाला.",
      true
    );


    // FORM CLEAR

    document.getElementById("eventTitle").value = "";
    document.getElementById("eventDate").value = "";
    document.getElementById("eventLocation").value = "";
    document.getElementById("eventDescription").value = "";
    document.getElementById("eventImage").value = "";

    document.getElementById("preview").style.display =
      "none";


    // LIST REFRESH

    await loadEvents();
  }


  // =====================================================
  // LOAD EVENTS
  // =====================================================

  async function loadEvents() {

    const list =
      document.getElementById("eventsList");

    const status =
      document.getElementById("eventsStatus");


    status.innerText =
      "कार्यक्रमांची माहिती लोड होत आहे...";

    list.innerHTML = "";


    const { data, error } =
      await supabaseClient
        .from("events")
        .select("*")
        .order("date", {
          ascending: false
        });


    if (error) {

      status.innerText =
        "Events लोड करताना Error: " +
        error.message;

      return;
    }


    if (!data || data.length === 0) {

      status.innerText =
        "सध्या कोणताही कार्यक्रम सेव्ह केलेला नाही.";

      return;
    }


    status.innerText =
      data.length +
      " कार्यक्रम सापडले.";


    data.forEach(function(event) {

      const div =
        document.createElement("div");

      div.className = "event";


      let html = "";

      html +=
        '<div class="event-title">' +
        escapeHtml(event.title || "") +
        '</div>';


      if (event.date) {

        html +=
          '<div class="small">📅 ' +
          escapeHtml(event.date) +
          '</div>';
      }


      if (event.location) {

        html +=
          '<div class="small">📍 ' +
          escapeHtml(event.location) +
          '</div>';
      }


      if (event.description) {

        html +=
          '<p>' +
          escapeHtml(event.description) +
          '</p>';
      }


      if (event.image) {

        html +=
          '<img src="' +
          escapeAttribute(event.image) +
          '" alt="कार्यक्रमाचा फोटो">';
      }


      div.innerHTML = html;

      list.appendChild(div);

    });

  }


  // =====================================================
  // SECURITY HELPERS
  // =====================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  // =====================================================
  // CHECK EXISTING SESSION
  // =====================================================

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      document.getElementById("loginSection")
        .classList.add("hidden");

      document.getElementById("adminSection")
        .classList.remove("hidden");

      loadEvents();
    }
  }


  checkSession();

</script>

</body>
</html>
